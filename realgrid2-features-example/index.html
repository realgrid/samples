<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RealGrid2 Features Example (API + pagination.js)</title>
    <!-- RealGrid CSS -->
    <link rel="stylesheet" type="text/css" href="../public/realgrid/latest/realgrid-style.css" />
    <!-- pagination.js CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/paginationjs/2.1.5/pagination.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="style.css" />

    <!-- jQuery -->
    <script type="text/javascript" src="../jquery/jquery-1.11.1.min.js"></script>
    <!-- RealGrid License and Library -->
    <script type="text/javascript" src="../public/realgrid/latest/realgrid-lic.js"></script>
    <script type="text/javascript" src="../public/realgrid/latest/realgrid.min.js"></script>
    <!-- pagination.js Library -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/paginationjs/2.1.5/pagination.min.js"></script>
    <!-- Custom App Logic -->
    <script type="text/javascript" src="app.js"></script>
</head>
<body>
    <h1>RealGrid2 Features: API Data, pagination.js, Sorting, Search</h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search posts..." />
        <button id="searchButton">Search</button>
    </div>

    <div id="realgrid" style="width: 100%; height: 500px;"></div>

    <div class="pagination-container-wrapper">
        <div id="pagination-container"></div>
    </div>

</body>
</html>
